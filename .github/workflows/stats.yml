# Writes star and follower counts to the stats branch as shields.io endpoint
# JSON, so the README badges don't depend on a shared GitHub token pool.
name: Profile stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch counts
        env:
          GH_TOKEN: ${{ github.token }}
          USER: ${{ github.repository_owner }}
        run: |
          stars=$(gh api "users/$USER/repos?type=owner&per_page=100" --paginate \
            --jq '.[] | select(.fork | not) | .stargazers_count' | awk '{s+=$1} END {print s+0}')
          followers=$(gh api "users/$USER" --jq '.followers')
          mkdir -p out
          printf '{"schemaVersion":1,"label":"Stars","message":"%s"}\n' "$stars" > out/stars.json
          printf '{"schemaVersion":1,"label":"Follow","message":"%s"}\n' "$followers" > out/followers.json
          cat out/*.json

      - name: Publish to stats branch
        run: |
          cd out
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update profile stats"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stats
